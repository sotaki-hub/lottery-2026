<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くじ引き</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f4f6f8;color:#202833;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100%,520px);background:#fff;border-radius:20px;padding:clamp(24px,5vw,40px);text-align:center;box-shadow:0 8px 28px rgba(20,35,50,.10)}
h1{margin:0 0 12px;font-size:clamp(1.5rem,5vw,2rem)}
.intro{margin:0 0 28px;color:#596574;line-height:1.7}
.result{min-height:150px;display:flex;align-items:center;justify-content:center;margin:0 0 24px;padding:20px;border:2px dashed #cbd3dc;border-radius:16px;background:#fafbfd}
.result-value{font-size:clamp(2.5rem,10vw,4rem);font-weight:750;color:#1f5d8f}
.result-placeholder{color:#778391;font-size:1.1rem}
button{width:100%;min-height:56px;border:0;border-radius:12px;background:#236da5;color:white;font-size:1.1rem;font-weight:700;cursor:pointer;padding:14px 20px}
button:hover:not(:disabled){background:#195783}
button:focus-visible{outline:3px solid #8bc5f0;outline-offset:3px}
button:disabled{background:#a8b3bd;cursor:not-allowed}
.notice{margin:18px 0 0;color:#687483;font-size:.9rem;line-height:1.6}
</style>
</head>
<body>
<main>
<h1>くじ引き</h1>
<p class="intro">ボタンを押して、くじを1回引いてください。</p>
<div class="result" id="result" aria-live="polite"><span class="result-placeholder">結果はここに表示されます</span></div>
<button id="drawButton" type="button">くじを引く</button>
</main>
<script>
(() => {
  // 画面を開いている間だけ結果を保持します。確率は画面に表示しません。
  const outcomes = [{value:100,weight:3},{value:200,weight:2},{value:500,weight:1}];
  const result = document.getElementById("result");
  const button = document.getElementById("drawButton");
  const notice = document.getElementById("notice");
  function showValue(value) {
    result.innerHTML = "";
    const span = document.createElement("span");
    span.className = "result-value";
    span.textContent = value;
    result.appendChild(span);
    button.disabled = true;
    button.textContent = "くじを引きました";
    notice.textContent = "結果を確認してください。";
  }
  button.addEventListener("click", () => {
    if (button.disabled) return;
    let draw = Math.random() * outcomes.reduce((sum, item) => sum + item.weight, 0);
    let chosen = outcomes[outcomes.length - 1].value;
    for (const item of outcomes) {
      draw -= item.weight;
      if (draw < 0) { chosen = item.value; break; }
    }
    showValue(chosen);
  });
})();
</script>
</body>
</html>
